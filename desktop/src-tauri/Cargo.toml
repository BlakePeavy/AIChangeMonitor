[package]
name = "change-monitor"
version = "0.1.0"
description = "Change Monitor — Tauri 2 shell around the aichange Go engine"
authors = ["Blake Peavy"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
panic = "abort"
strip = true
